version: '3.8'

services:
  whatsapp-gateway:
    build: .
    container_name: arsalynt-whatsapp-gateway
    restart: always
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - NEXTJS_WEBHOOK_URL=http://host.docker.internal:3000/api/whatsapp/webhook
      - GATEWAY_SECRET=arsalynt-wa-secret-2026
    volumes:
      - ./auth_info_baileys:/app/auth_info_baileys
